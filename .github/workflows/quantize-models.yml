name: Quantize models

# Manually triggered: downloads OleehyO/TexTeller FP32 ONNX, quantizes weights to
# INT4 (MatMulNBits), uploads as a workflow artifact AND optionally pushes to HF Hub.
#
# Why INT4 only: a local profile run on 20 eval samples (see runs/quant_profile.md)
# showed INT8 dynamic barely shrinks this model's decoder (951 MB), and INT2 is
# not deployable in ORT Web. INT4 lands at 256 MB total with the same render
# quality as INT8 — single clear winner.
#
# Other variants (int8, int2) remain available via scripts/quantize_onnx.py for
# local experimentation; they're just not part of the CI/CD path.
#
# Outputs:
#   - workflow artifact `texteller-quantized-{sha}` (consumed by deploy-web.yml)
#   - (if HF_TOKEN secret is set) HF repo `${{ vars.HF_QUANT_REPO }}`

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Quant variants to build (default: int4 — see runs/quant_profile.md)"
        default: "int4"
        required: true
      block_size:
        description: "MatMulNBits block size"
        default: "32"
        required: true
      push_to_hf:
        description: "Also upload to HF Hub repo (requires HF_TOKEN secret)"
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install quantization deps
        run: |
          python -m pip install --upgrade pip
          # onnx_ir is required by onnxruntime >= 1.25's MatMulNBitsQuantizer
          # but is not declared as a runtime dep — install it explicitly.
          pip install onnx onnxruntime onnx_ir "huggingface_hub>=0.24"

      - name: Cache HF source download
        uses: actions/cache@v5
        with:
          path: .hf_cache
          key: hf-texteller-onnx-fp32-v1

      - name: Quantize
        run: |
          python scripts/quantize_onnx.py \
            --variants "${{ inputs.variants }}" \
            --block-size "${{ inputs.block_size }}" \
            --out web/public/models \
            --cache .hf_cache

      - name: Summarize sizes
        run: |
          {
            echo "## Quantization output"
            echo "| variant | total MB | files |"
            echo "|---|---|---|"
            for d in web/public/models/*/onnx; do
              v=$(basename "$(dirname "$d")")
              total=$(du -sm "$d" | cut -f1)
              files=$(find "$d" -mindepth 1 -maxdepth 1 -printf '%f ')
              echo "| $v | ${total} | $files |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: texteller-quantized-${{ github.sha }}
          path: web/public/models
          retention-days: 30
          # int4+int8 together can exceed 500MB; default compression is fine.
          compression-level: 0

      - name: Push to HF Hub
        if: ${{ inputs.push_to_hf == true }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_QUANT_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set; skipping HF Hub upload."
            exit 0
          fi
          if [ -z "$HF_REPO" ]; then
            echo "::warning::HF_QUANT_REPO repository variable is not set; skipping HF Hub upload."
            exit 0
          fi
          pip install "huggingface_hub[cli]"
          huggingface-cli login --token "$HF_TOKEN" --add-to-git-credential
          for v in web/public/models/*/; do
            name=$(basename "$v")
            huggingface-cli upload "$HF_REPO" "$v" "$name" --repo-type model \
              --commit-message "quantize: $name from ${{ github.sha }}"
          done
