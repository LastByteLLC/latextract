[project]
name = "latextract"
version = "0.0.1"
description = "Deterministic, self-verifying formula-to-LaTeX library"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tom Barrasso" }]
dependencies = [
    "torch>=2.5",
    "torchvision",
    "transformers>=4.45",
    "accelerate",
    "safetensors",
    "pillow",
    "numpy",
    "scikit-image",
    "scipy",
    "pymupdf",
    "arxiv",
    "requests",
    "tqdm",
    "rich",
    "typer",
    "pylatexenc",
    "outlines>=0.1.0",
]

[project.optional-dependencies]
mlx = ["mlx", "mlx-lm"]
dev = ["pytest", "ruff", "ipykernel", "matplotlib"]

[project.scripts]
latextract = "latextract.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latextract"]

[tool.ruff]
line-length = 110
target-version = "py311"
